<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IELTS Master — Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/data.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body { background:linear-gradient(135deg,#1a1a2e 0%,#922b21 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; }
      .auth-card { background:#fff; border-radius:16px; width:100%; max-width:460px; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden; }
      .auth-brand { background:var(--red); color:#fff; padding:28px 36px; text-align:center; }
      .auth-brand .brand-icon { width:52px; height:52px; background:rgba(255,255,255,.2); border-radius:14px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
      .auth-brand h1 { font-size:22px; font-weight:700; letter-spacing:1px; margin-bottom:4px; }
      .auth-brand p  { font-size:13px; opacity:.8; }
      .auth-body { padding:28px 32px 32px; }
      .auth-tabs { display:flex; background:#f3f4f6; border-radius:8px; padding:4px; margin-bottom:26px; }
      .auth-tab  { flex:1; padding:9px; border-radius:6px; border:none; background:none; cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; color:var(--muted); transition:.2s; }
      .auth-tab.active { background:#fff; color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.1); }
      .google-btn { width:100%; padding:12px; border:1.5px solid #dadce0; background:#fff; color:#3c4043; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:.2s; font-family:inherit; }
      .google-btn:hover { background:#f8f9fa; box-shadow:0 1px 4px rgba(0,0,0,.15); }
      .google-btn svg { width:20px; height:20px; flex-shrink:0; }
      .role-selector { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
      .role-option { border:2px solid var(--border); border-radius:8px; padding:14px 10px; text-align:center; cursor:pointer; transition:.2s; }
      .role-option:hover { border-color:var(--red); }
      .role-option.selected { border-color:var(--red); background:var(--red-light,#fef2f2); }
      .role-option .ro-icon  { font-size:26px; margin-bottom:6px; }
      .role-option .ro-label { font-size:13px; font-weight:700; }
      .role-option .ro-sub   { font-size:11px; color:var(--muted); }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>IELTS MASTER</h1>
        <p>Academic Test Practice Platform</p>
      </div>
      <div class="auth-body">
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
          <button class="auth-tab" onclick="switchTab('register')">Register</button>
        </div>

        <div id="alert-box" class="alert hidden"></div>

        <!-- LOGIN -->
        <div id="panel-login">

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="Your password">
          </div>
          <button class="btn btn-primary btn-full" onclick="doEmailLogin()">Log In</button>
          <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted)">
            No account? <a href="#" onclick="switchTab('register')" style="color:var(--red);font-weight:600">Register here</a>
          </p>
        </div>

        <!-- REGISTER -->
        <div id="panel-register" style="display:none">

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password <span id="pw-hint" style="font-size:11px;color:var(--muted)">(min. 6 characters)</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters">
          </div>
          <div class="form-group">
            <label>I am registering as</label>
            <div class="role-selector">
              <div class="role-option selected" id="role-student" onclick="selectRole('student')">
                <div class="ro-icon">🎓</div>
                <div class="ro-label">Student</div>
                <div class="ro-sub">Take tests &amp; track progress</div>
              </div>
              <div class="role-option" id="role-teacher" onclick="selectRole('teacher')">
                <div class="ro-icon">👩‍🏫</div>
                <div class="ro-label">Teacher</div>
                <div class="ro-sub">View student results</div>
              </div>
            </div>
          </div>
          <button class="btn btn-primary btn-full" onclick="doRegister()">Create Account</button>
          <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted)">
            Already have an account? <a href="#" onclick="switchTab('login')" style="color:var(--red);font-weight:600">Sign in</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', async () => {
        const u = await Auth.currentUser();
        if (u) redirect();
      });

      function redirect() { window.location.href = 'pages/dashboard.html'; }

      let selectedRole = 'student';

      function selectRole(r) {
        selectedRole = r;
        document.getElementById('role-student').classList.toggle('selected', r === 'student');
        document.getElementById('role-teacher').classList.toggle('selected', r === 'teacher');
        // Update password hint for teacher role
        const hint = document.getElementById('pw-hint');
        if (hint) {
          hint.textContent = r === 'teacher'
            ? '(enter the teacher code)'
            : '(min. 6 characters)';
        }
      }

      function switchTab(tab) {
        document.querySelectorAll('.auth-tab').forEach((t, i) =>
          t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'))
        );
        document.getElementById('panel-login').style.display    = tab === 'login'    ? 'block' : 'none';
        document.getElementById('panel-register').style.display = tab === 'register' ? 'block' : 'none';
        hideAlert();
      }

      function showAlert(msg, type = 'error') {
        const el = document.getElementById('alert-box');
        el.textContent = msg;
        el.className = `alert alert-${type}`;
      }
      function hideAlert() {
        document.getElementById('alert-box').className = 'alert hidden';
      }

      // ── Google login via OAuth redirect (works in all browsers) ──
      async function doGoogleLogin(role) {
        showAlert('Redirecting to Google…', 'info');
        const result = await Auth.loginWithGoogle(role);
        if (!result.ok) showAlert(result.error);
        // If ok, browser is redirecting — nothing more to do
      }

      async function doEmailLogin() {
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        if (!email || !password) { showAlert('Please enter your email and password.'); return; }
        showAlert('Signing in…', 'info');
        const result = await Auth.loginEmail(email, password);
        if (result.ok) {
          if (result.magicLink) {
            showAlert('Check your email for a magic link to complete teacher sign-in.', 'info');
          } else {
            redirect();
          }
        } else {
          if (result.error.includes('Email not confirmed')) {
            showAlert('Please check your email and click the confirmation link first, then try logging in again.');
          } else {
            showAlert(result.error);
          }
        }
      }


      async function doRegister() {
        const name     = document.getElementById('reg-name').value.trim();
        const email    = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        if (!name)  { showAlert('Please enter your full name.');   return; }
        if (!email) { showAlert('Please enter your email.');       return; }

        const isTeacher = selectedRole === 'teacher';
        if (isTeacher && password !== 'Gitpush4611') {
          showAlert('Incorrect teacher code. Please enter the code provided by your school.');
          return;
        }
        if (!isTeacher && password.length < 6) {
          showAlert('Password must be at least 6 characters.');
          return;
        }

        showAlert('Creating account…', 'info');
        const result = await Auth.registerEmail(name, email, password);
        if (result.ok) {
          if (result.isTeacher) {
            showAlert(
              'Teacher account created! Check your email to confirm it, then log in with your email + teacher code.',
              'info'
            );
          } else {
            showAlert(
              'Account created! Check your email inbox and click the confirmation link, then sign in.',
              'info'
            );
          }
          switchTab('login');
        } else {
          showAlert(result.error);
        }
      }

      document.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          if (document.getElementById('panel-login').style.display !== 'none') doEmailLogin();
          else doRegister();
        }
      });
    </script>
  </body>
</html>
