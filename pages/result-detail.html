<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Result Detail — IELTS Master</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/data.js" defer></script>
    <style>
      .back-link {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 14px; color: var(--muted); text-decoration: none;
        margin-bottom: 24px; font-weight: 500;
      }
      .back-link:hover { color: var(--red); }

      /* Hero score card */
      .result-hero {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 16px;
        padding: 32px 36px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 32px;
        flex-wrap: wrap;
      }
      .rh-band {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
      }
      .rh-label {
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
      }
      .rh-divider {
        width: 1px; background: var(--border); align-self: stretch;
        flex-shrink: 0;
      }
      .rh-meta { flex: 1; min-width: 180px; }
      .rh-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
      .rh-sub   { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
      .rh-stats {
        display: flex; gap: 24px; flex-wrap: wrap;
      }
      .rh-stat-num   { font-size: 22px; font-weight: 700; }
      .rh-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

      /* Progress bar */
      .prog-outer {
        height: 10px; background: var(--border); border-radius: 5px;
        overflow: hidden; margin-top: 14px;
      }
      .prog-inner {
        height: 100%; border-radius: 5px;
        transition: width .6s ease;
      }

      /* Answer grid */
      .answers-section {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 14px;
        padding: 28px 32px;
      }
      .answers-section h2 {
        font-size: 16px; font-weight: 700; margin-bottom: 20px;
      }
      .answers-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 10px;
      }
      .answer-row {
        display: flex; align-items: flex-start; gap: 10px;
        border-radius: 10px; padding: 12px 14px; font-size: 13px;
      }
      .answer-row.correct { background: #f0fdf4; }
      .answer-row.wrong   { background: #fef2f2; }
      .answer-row.no-key  { background: var(--bg); }
      .ar-q    { font-weight: 700; min-width: 30px; font-size: 13px; }
      .ar-body { flex: 1; line-height: 1.55; }
      .ar-yours   { font-weight: 600; }
      .ar-correct { font-size: 12px; color: var(--green); margin-top: 2px; }
      .ar-icon    { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

      /* Explanation badge */
      .ar-expl {
        font-size: 11px; color: var(--muted);
        margin-top: 4px; font-style: italic;
      }

      @media (max-width: 600px) {
        .result-hero { padding: 20px; gap: 16px; }
        .rh-band { font-size: 52px; }
        .rh-divider { display: none; }
        .answers-section { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <header class="app-header" id="app-header"></header>
    <main class="app-main" id="main">
      <a href="results.html" class="back-link">← Back to My Results</a>
      <div id="content">
        <div style="text-align:center;padding:80px;color:var(--muted)">
          <div style="font-size:36px;margin-bottom:12px">⏳</div>
          Loading result…
        </div>
      </div>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const user = await Auth.initUser('student');
        if (!user) return;
        renderHeader('results.html');

        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid');
        const idx = parseInt(params.get('idx'), 10);

        if (!uid || isNaN(idx)) {
          showError('Missing result parameters.');
          return;
        }
        if (uid !== user.id) {
          showError('You can only view your own results.');
          return;
        }

        const results = await DB.getUserResults(uid);
        const r = results[idx];
        if (!r) {
          showError('Result not found.');
          return;
        }

        renderDetail(r);
      });

      function showError(msg) {
        document.getElementById('content').innerHTML =
          `<div style="text-align:center;padding:60px;color:var(--muted)">
            <div style="font-size:36px;margin-bottom:12px">⚠️</div>
            <p>${msg}</p>
            <a href="results.html" class="btn btn-outline" style="margin-top:16px">← Back to Results</a>
           </div>`;
      }

      /* Flatten answer key entry → array of accepted strings */
      function getAlts(entry) {
        if (!entry) return [];
        if (Array.isArray(entry)) {
          const flat = entry.flat ? entry.flat() : [].concat(...entry);
          return flat.map(a => String(a).trim()).filter(a => a);
        }
        return String(entry).trim() ? [String(entry).trim()] : [];
      }

      function renderDetail(r) {
        const band  = bandScore(r.score, r.total);
        const pct   = pctScore(r.score, r.total);
        const color = bandColor(pct);
        const emoji = band >= 7.5 ? '🏆' : band >= 6 ? '🎯' : band >= 5 ? '📈' : '💪';
        const typeLabel = r.type === 'reading' ? '📖 Reading' : '🎧 Listening';

        /* Build per-answer rows */
        const answers = r.answers || [];
        const correctAnswers = r.correct_answers || [];
        const explanations   = r.explanations   || [];

        const hasKey = correctAnswers.some(entry => getAlts(entry).length > 0);

        const answersHTML = answers.map((ans, i) => {
          const alts = getAlts(correctAnswers[i]);
          const expl = explanations[i] || '';

          if (!alts.length) {
            return `<div class="answer-row no-key">
              <div class="ar-q">Q${i + 1}</div>
              <div class="ar-body">
                <div class="ar-yours">${ans || '<em style="color:var(--muted)">blank</em>'}</div>
                ${expl ? `<div class="ar-expl">${expl}</div>` : ''}
              </div>
              <div class="ar-icon">—</div>
            </div>`;
          }

          const ok = alts.some(a => (ans || '').trim().toLowerCase() === a.toLowerCase());
          const acceptedStr = alts.join(' / ');

          return `<div class="answer-row ${ok ? 'correct' : 'wrong'}">
            <div class="ar-q">Q${i + 1}</div>
            <div class="ar-body">
              <div class="ar-yours" style="color:${ok ? 'var(--green)' : 'var(--red)'}">
                ${ans || '<em style="opacity:.6">blank</em>'}
              </div>
              ${!ok ? `<div class="ar-correct">✓ ${acceptedStr}</div>` : ''}
              ${expl ? `<div class="ar-expl">${expl}</div>` : ''}
            </div>
            <div class="ar-icon">${ok ? '✅' : '❌'}</div>
          </div>`;
        }).join('');

        document.title = r.test + ' — IELTS Master';

        document.getElementById('content').innerHTML = `
          <!-- Hero -->
          <div class="result-hero">
            <div>
              <div class="rh-band" style="color:${color}">${band}</div>
              <div class="rh-label">Band Score</div>
            </div>
            <div class="rh-divider"></div>
            <div class="rh-meta">
              <div class="rh-title">${r.test}</div>
              <div class="rh-sub">${typeLabel} · ${r.date}</div>
              <div class="rh-stats">
                <div>
                  <div class="rh-stat-num">${r.score}/${r.total}</div>
                  <div class="rh-stat-label">Score</div>
                </div>
                <div>
                  <div class="rh-stat-num" style="color:${color}">${pct}%</div>
                  <div class="rh-stat-label">Correct</div>
                </div>
                <div>
                  <div class="rh-stat-num">${emoji}</div>
                  <div class="rh-stat-label">Result</div>
                </div>
              </div>
              <div class="prog-outer">
                <div class="prog-inner" style="width:${pct}%;background:${color}"></div>
              </div>
            </div>
          </div>

          <!-- Answers -->
          <div class="answers-section">
            <h2>${hasKey ? '📋 Answer Review' : '📋 Your Answers'} ${!hasKey ? '<span style="font-size:12px;font-weight:400;color:var(--muted)">(no answer key for this test)</span>' : ''}</h2>
            ${answers.length
              ? `<div class="answers-grid">${answersHTML}</div>`
              : `<p style="color:var(--muted);font-size:14px">No answer data recorded for this result.</p>`
            }
          </div>`;
      }
    </script>
  </body>
</html>
